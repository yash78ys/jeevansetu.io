<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal & Emergency Contacts - JEEVANSETU</title>
  <meta name="description" content="Manage personal emergency contacts, profile details, and track your emergency history.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar-custom">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand-custom">
        <div class="brand-icon">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <span>JEEVAN<span class="text-danger">SETU</span></span>
      </a>

      <div class="d-none d-md-flex align-items-center gap-2">
        <a href="index.html" class="nav-link-custom"><i class="fa-solid fa-house me-1"></i> Home</a>
        <a href="sos.html" class="nav-link-custom"><i class="fa-solid fa-triangle-exclamation me-1 text-danger"></i> SOS Dispatch</a>
        <a href="hospitals.html" class="nav-link-custom"><i class="fa-solid fa-hospital me-1 text-success"></i> Hospitals</a>
        <a href="donors.html" class="nav-link-custom"><i class="fa-solid fa-droplet me-1 text-danger"></i> Blood Donors</a>
        <a href="admin.html" class="nav-link-custom"><i class="fa-solid fa-shield-halved me-1 text-info"></i> Dispatcher Admin</a>
      </div>

      <div class="d-flex align-items-center gap-3">
        <div id="nav-user-info">
          <a href="user.html" class="nav-link-custom active"><i class="fa-solid fa-user me-1"></i> User Portal</a>
        </div>
        <a href="sos.html" class="nav-sos-btn"><i class="fa-solid fa-bolt"></i> SOS NOW</a>
      </div>
    </div>
  </nav>

  <!-- User Portal Container -->
  <div class="container py-4">
    
    <div class="row g-4">
      
      <!-- Left Column: User Profile & Emergency Contacts -->
      <div class="col-lg-5">
        
        <!-- User Profile Card -->
        <div class="glass-panel p-4 mb-4">
          <h5 class="fw-bold text-main mb-3"><i class="fa-solid fa-id-card text-info me-2"></i> User Account Details</h5>
          <div id="user-profile-card">
            <div class="text-center py-3 text-muted">Loading profile data...</div>
          </div>
        </div>

        <!-- Emergency Contacts Manager -->
        <div class="glass-panel p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-main mb-0"><i class="fa-solid fa-people-group text-warning me-2"></i> Emergency Contacts</h5>
            <span class="badge bg-warning text-dark">Auto-Notified on SOS</span>
          </div>

          <div id="contacts-list" class="mb-4">
            <div class="text-center py-2 text-muted small">Loading emergency contacts...</div>
          </div>

          <!-- Add Emergency Contact Form -->
          <form id="add-contact-form" class="border-top border-light pt-3">
            <h6 class="fw-bold text-main mb-2 small"><i class="fa-solid fa-user-plus me-1"></i> Add New Trusted Contact</h6>
            <div class="row g-2">
              <div class="col-12">
                <input type="text" id="contact-name" class="form-control form-control-dark form-control-sm" placeholder="Contact Name (e.g. Sunita - Wife)" required>
              </div>
              <div class="col-8">
                <input type="tel" id="contact-phone" class="form-control form-control-dark form-control-sm" placeholder="Phone Number (10 digits)" required pattern="[0-9]{10}">
              </div>
              <div class="col-4">
                <button type="submit" class="btn btn-red btn-sm w-100"><i class="fa-solid fa-plus me-1"></i> Add</button>
              </div>
            </div>
          </form>
        </div>

      </div>

      <!-- Right Column: Login & Registration Tabs -->
      <div class="col-lg-7">
        <div class="glass-panel p-4">
          
          <ul class="nav nav-tabs border-light mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active text-main fw-bold" id="user-login-tab" data-bs-toggle="tab" data-bs-target="#user-login-pane" type="button"><i class="fa-solid fa-right-to-bracket me-1"></i> Account Login</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link text-main fw-bold" id="user-reg-tab" data-bs-toggle="tab" data-bs-target="#user-reg-pane" type="button"><i class="fa-solid fa-user-plus me-1"></i> Create Account</button>
            </li>
          </ul>

          <div class="tab-content" id="authTabsContent">
            
            <!-- Login Form -->
            <div class="tab-pane fade show active" id="user-login-pane" role="tabpanel">
              <form id="user-login-form">
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">Email or Phone Number</label>
                  <input type="text" id="login-email-phone" class="form-control form-control-dark" placeholder="e.g. rajesh.kumar@example.com or 9876543210" required>
                </div>

                <div class="mb-4">
                  <label class="form-label text-muted small fw-semibold">Password</label>
                  <input type="password" id="login-password" class="form-control form-control-dark" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-red w-100 py-2 fw-bold"><i class="fa-solid fa-right-to-bracket me-2"></i> Log In to User Account</button>
              </form>
            </div>

            <!-- Registration Form -->
            <div class="tab-pane fade" id="user-reg-pane" role="tabpanel">
              <form id="user-reg-form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">Full Name</label>
                    <input type="text" id="reg-name" class="form-control form-control-dark" placeholder="e.g. Rajesh Kumar" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">Email Address</label>
                    <input type="email" id="reg-email" class="form-control form-control-dark" placeholder="rajesh@example.com" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">Phone Number</label>
                    <input type="tel" id="reg-phone" class="form-control form-control-dark" placeholder="9876543210" required pattern="[0-9]{10}">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">Blood Group</label>
                    <select id="reg-blood-group" class="form-select form-select-dark" required>
                      <option value="">Select Blood Group</option>
                      <option value="A+">A+</option>
                      <option value="A-">A-</option>
                      <option value="B+">B+</option>
                      <option value="B-">B-</option>
                      <option value="AB+">AB+</option>
                      <option value="AB-">AB-</option>
                      <option value="O+">O+</option>
                      <option value="O-">O-</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label text-muted small fw-semibold">Account Password</label>
                    <input type="password" id="reg-password" class="form-control form-control-dark" placeholder="At least 6 characters" required minlength="6">
                  </div>
                  <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-red w-100 py-2 fw-bold"><i class="fa-solid fa-user-plus me-2"></i> Complete Registration</button>
                  </div>
                </div>
              </form>
            </div>

          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- Footer -->
  <footer>
    <div class="container text-center">
      <p class="text-muted small mb-0">© 2026 JEEVANSETU - User Profile & Emergency Contacts Module.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initUserPage();
    });
  </script>
</body>
</html>
